<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Poker 8-BIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Video de fondo pixelado -->
  <div class="video-bg">
    <video id="bgVideo" autoplay muted loop playsinline crossorigin="anonymous">
      <source src="https://pixabay.com/es/videos/download/video-61767_medium.mp4" type="video/mp4">
    </video>
    <canvas id="pixelCanvas"></canvas>
  </div>

  <!-- Scanlines retro -->
  <div class="scanlines"></div>

  <header>
    <h1>★ TAROT POKER ★</h1>
    <p>&gt; SIGNIFICADO DE LAS CARTAS &lt;</p>
  </header>

  <div class="search-box">
    <span class="prompt">&gt;</span>
    <input type="text" id="searchInput" placeholder="BUSCAR CARTA...">
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <script src="script.js"></script>
</body>
</html>
